name: Load Environment Config
description: >
  Parse an env_map JSON definition, select the target cluster, export CD_ROOT, 
  and flatten the UAMI map (uami_name → client_id). 
  Provides cluster, dns_zone, and UAMI mapping for downstream steps.

author: Affinity7 Consulting Ltd
branding:
  icon: cloud
  color: blue

inputs:
  env_map:
    description: "Inline JSON env_map defining environments, clusters, dns_zones, and UAMI maps."
    required: false
  target_environment:
    description: "Logical environment name (e.g. prod, qa)."
    required: true
  target_cluster:
    description: "Optional cluster override to directly select a cluster."
    required: false
  target_cloud:
    description: >
      Optional cloud (aws | azure) used to choose between clusters of the same
      environment. Ignored when target_cluster is given. When omitted, the
      runner's own cloud breaks a tie, never vetoes a choice.
    required: false
  namespace:
    description: "Kubernetes namespace for the deployment context."
    required: true
  delete_only:
    description: "Skip UAMI export if true."
    required: false
    default: "false"

outputs:
  cluster:
    description: "Selected cluster name"
    value: ${{ steps.set_outputs.outputs.cluster }}
  dns_zone:
    description: "Cluster DNS zone"
    value: ${{ steps.set_outputs.outputs.dns_zone }}
  container_registry:
    description: "Cluster container registry"
    value: ${{ steps.set_outputs.outputs.container_registry }}
  uami_vars_b64:
    description: "Flattened UAMI name → client_id map base64 encoded"
    value: ${{ steps.set_outputs.outputs.uami_vars_b64 }}
  cd_root:
    description: "Continuous deployment repo path"
    value: ${{ steps.set_outputs.outputs.cd_root }}
  cloud:
    description: "Selected cluster's cloud (aws | azure), empty for an env_map that does not declare one"
    value: ${{ steps.set_outputs.outputs.cloud }}


runs:
  using: composite
  steps:
    # --- Which cloud is this runner in? ---
    #
    # Run unconditionally and use the answer only when a choice has to be made.
    # One IMDS call with a short timeout, against a workflow measured in
    # minutes, in exchange for a single code path below.
    #
    # It is a TIE-BREAK, never a veto: a runner with a VPN to the other cloud
    # deploys there legitimately, so nothing here compares the runner's cloud
    # against the cluster that was chosen by name or by target_cloud.
    - name: Detect runner cloud
      id: cloud
      uses: gitopsmanager/detect-cloud@v1

    # --- Parse env_map and select cluster ---
    - name: Load environment config (JSON)
      id: env
      uses: actions/github-script@v9
      env:
        INLINE_ENV_MAP: ${{ inputs.env_map }}
        ENV_MAP: ${{ env.ENV_MAP }}
        ENVIRONMENT: ${{ inputs.target_environment }}
        CLUSTER_IN: ${{ inputs.target_cluster }}
        CLOUD_IN: ${{ inputs.target_cloud }}
        CLOUD_DETECTED: ${{ steps.cloud.outputs.provider }}
        NAMESPACE: ${{ inputs.namespace }}
      with:
        script: |
          const sourceInput = (process.env.INLINE_ENV_MAP || '').trim();
          const sourceEnv   = (process.env.ENV_MAP || '').trim();
          const raw = sourceInput || sourceEnv;

          if (!raw) {
            core.setFailed('❌ No env_map provided. Pass inputs.env_map OR set ENV_MAP.');
            return;
          }
          let map;
          try { map = JSON.parse(raw); }
          catch (err) { core.setFailed(`❌ env_map invalid JSON: ${err.message}`); return; }

          const envName   = (process.env.ENVIRONMENT || '').trim();
          const clusterIn = (process.env.CLUSTER_IN || '').trim();
          const cloudIn   = (process.env.CLOUD_IN || '').trim().toLowerCase();
          const detected  = (process.env.CLOUD_DETECTED || '').trim().toLowerCase();
          let selected;

          // An env_map written before clusters declared a cloud returns ''.
          // Every rule below treats that as "unknown", never as "no match",
          // so an older map resolves exactly as it always did.
          const cloudOf = c => String(c.cloud || '').trim().toLowerCase();

          if (clusterIn) {
            const allClusters = Object.entries(map)
              .flatMap(([env, val]) => (val.clusters || []).map(c => ({ ...c, __env: env })));
            selected = allClusters.find(c => String(c.cluster).toLowerCase() === clusterIn.toLowerCase());
            if (!selected) {
              const available = allClusters.map(c => `${c.cluster} (env=${c.__env})`);
              core.setFailed(`❌ target_cluster '${clusterIn}' not found. Available: ${available.join(', ')}`);
              return;
            }
            core.info(`Cluster override: using cluster '${selected.cluster}' (env='${selected.__env}')`);
            // target_cluster names one cluster, so there is nothing left to
            // choose and nothing to fail on. Said out loud rather than ignored
            // silently, because the two inputs disagree about a real thing.
            if (cloudIn && cloudOf(selected) && cloudOf(selected) !== cloudIn) {
              core.warning(
                `target_cloud='${cloudIn}' ignored: target_cluster '${selected.cluster}' ` +
                `is in ${cloudOf(selected)}.`);
            }
          } else {
            if (!Object.hasOwn(map, envName)) {
              core.setFailed(`❌ Environment '${envName}' not found. Available: ${Object.keys(map).join(', ')}`);
              return;
            }
            const entry = map[envName];
            if (!Array.isArray(entry.clusters) || entry.clusters.length === 0) {
              core.setFailed(`❌ env_map['${envName}'].clusters missing or empty.`);
              return;
            }
            let candidates = entry.clusters;

            // 1. target_cloud, when given, is the user stating which one they
            //    want. A row that does not declare its cloud is kept: a filter
            //    may only narrow what is already known, never discard a cluster
            //    on the strength of a field its env_map never had.
            if (cloudIn) {
              const narrowed = candidates.filter(c => !cloudOf(c) || cloudOf(c) === cloudIn);
              if (narrowed.length === 0) {
                const clouds = [...new Set(candidates.map(cloudOf).filter(Boolean))];
                core.setFailed(
                  `❌ No cluster in '${envName}' is in cloud '${cloudIn}'. ` +
                  `That environment has: ${clouds.join(', ')}.`);
                return;
              }
              candidates = narrowed;
            }

            // 2. Still a choice to make, and nobody said which. The runner's own
            //    cloud breaks the tie -- and ONLY breaks a tie: it is never
            //    consulted when there is one cluster, so deploying across a VPN
            //    to the other cloud is unaffected.
            if (candidates.length > 1 && !cloudIn && detected && detected !== 'unknown') {
              const narrowed = candidates.filter(c => cloudOf(c) === detected);
              if (narrowed.length === 1) {
                core.warning(
                  `Environment '${envName}' has clusters in more than one cloud. ` +
                  `Selected '${narrowed[0].cluster}' because this runner is in ${detected}. ` +
                  `Pass target_cloud or target_cluster to choose explicitly.`);
                candidates = narrowed;
              }
            }

            if (candidates.length > 1) {
              const opts = candidates.map(c => cloudOf(c) ? `${c.cluster} (${cloudOf(c)})` : String(c.cluster))
                                     .filter(Boolean);
              // Asking again for something already supplied is a dead end. When
              // no entry declares a cloud, target_cloud CANNOT narrow anything,
              // and the map is the thing to fix -- it predates the field.
              const declaresCloud = candidates.some(c => cloudOf(c));
              const advice = declaresCloud
                ? 'Provide target_cluster or target_cloud.'
                : 'This env_map declares no cloud on its clusters, so target_cloud cannot choose ' +
                  'between them. Provide target_cluster, or regenerate the env_map from a version ' +
                  'of GitOps Manager that writes it.';
              core.setFailed(`❌ Multiple clusters in '${envName}'. ${advice} Options: ${opts.join(', ')}`);
              return;
            }

            selected = candidates[0];
            core.info(`Selected cluster '${selected.cluster}' from env '${envName}'.`);
          }

          const cluster = String(selected.cluster || '');
          const dnsZone = String(selected.dns_zone || '');
          const registry = String(selected.container_registry || '');
          const uami = Array.isArray(selected.uami_map) ? selected.uami_map : [];

          if (!cluster) { core.setFailed('❌ Selected cluster name empty.'); return; }
          if (!dnsZone) { core.setFailed(`❌ Cluster '${cluster}' missing dns_zone.`); return; }

          core.setOutput('cluster', cluster);
          core.setOutput('dns_zone', dnsZone);
          core.setOutput('container_registry', registry);
          core.setOutput('cloud', cloudOf(selected));
          core.setOutput('uami_map', JSON.stringify(uami));
          core.setOutput('namespace', process.env.NAMESPACE);

    # --- Export CD_ROOT ---
    - name: Export CD_ROOT
      id: cdroot
      shell: bash
      run: |
        CD_ROOT="continuous-deployment/${{ steps.env.outputs.cluster }}/${{ inputs.namespace }}"
        echo "CD_ROOT=$CD_ROOT" >> "$GITHUB_ENV"
        echo "cd_root=$CD_ROOT" >> "$GITHUB_OUTPUT"

    # --- Export UAMI vars ---
    - name: Export UAMI env vars (uami_name → client_id)
      id: uami
      if: ${{ inputs.delete_only == 'false' }}
      uses: actions/github-script@v9
      env:
        UAMI_JSON: ${{ steps.env.outputs.uami_map }}
        CLUSTER: ${{ steps.env.outputs.cluster }}
      with:
        script: |
          const clusterName = (process.env.CLUSTER || '').trim();
          let arr = [];
          try { arr = JSON.parse(process.env.UAMI_JSON || '[]'); }
          catch { core.setFailed('❌ Invalid uami_map JSON'); return; }

          if (!Array.isArray(arr) || arr.length === 0) {
            core.info('No UAMI entries found.');
            core.setOutput("uami_vars", "{}");
            return;
          }

          const seen = new Set();
          const exported = {};

          for (const [i, u] of arr.entries()) {
            let name = String(u.uami_name || '').trim();
            const cid  = String(u.client_id || '').trim();
            const rg   = String(u.uami_resource_group || '').trim();

            if (!name || !cid) {
              core.warning(`Skipping UAMI index ${i}: missing uami_name or client_id.`);
              continue;
            }

            const prefix = clusterName + "-";
            if (name.toLowerCase().startsWith(prefix.toLowerCase())) {
              name = name.substring(prefix.length);
            }

            let varName = name.replace(/-/g, "_");
            if (!/^[A-Za-z_]/.test(varName)) varName = `_${varName}`;
            if (seen.has(varName)) {
              core.warning(`Duplicate UAMI var '${varName}' (rg='${rg}'). Skipping duplicate.`);
              continue;
            }

            exported[varName.toLowerCase()] = cid;
            seen.add(varName);
          }


          const encoded = Buffer.from(JSON.stringify(exported)).toString('base64');
          core.setOutput("uami_vars_b64", encoded);
          core.info("UAMI vars exported (base64):");
          core.info(encoded);



    # --- Re-export combined outputs for parent workflow ---
    - name: Set final outputs
      id: set_outputs              # 👈 required!
      shell: bash
      run: |
        echo "cluster=${{ steps.env.outputs.cluster }}" >> "$GITHUB_OUTPUT"
        echo "dns_zone=${{ steps.env.outputs.dns_zone }}" >> "$GITHUB_OUTPUT"
        echo "container_registry=${{ steps.env.outputs.container_registry }}" >> "$GITHUB_OUTPUT"
        echo "uami_vars_b64=${{ steps.uami.outputs.uami_vars_b64 }}" >> "$GITHUB_OUTPUT"
        echo "cd_root=${{ steps.cdroot.outputs.cd_root }}" >> "$GITHUB_OUTPUT"
        echo "cloud=${{ steps.env.outputs.cloud }}" >> "$GITHUB_OUTPUT"

